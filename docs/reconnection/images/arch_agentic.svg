<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-agentic-title arch-agentic-desc" font-family="Geist, system-ui, sans-serif">
  <title id="arch-agentic-title">Solar research agent system</title>
  <desc id="arch-agentic-desc">An orchestrator agent delegates to monitor, modelling, retrieval and reporter agents, each of which uses one tool: live data, simulation and ML models, memory, and a human-reviewed bulletin.</desc>
  <defs>
    <pattern id="ag-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
    <marker id="ag-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="ag-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="ag-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#ag-dots)" opacity="0.55"/>

  <text x="40" y="36" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE · AGENTIC SOLAR ANALYST</text>

  <!-- Zone: agents -->
  <rect x="328" y="64" width="224" height="316" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="408" y="58" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="440" y="67" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AGENTS</text>
  <!-- Zone: tools -->
  <rect x="608" y="64" width="224" height="316" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="680" y="58" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="720" y="67" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TOOLS · OUTPUT</text>

  <!-- Arrows: orchestrator fan-out -->
  <path d="M 260,212 H 276 Q 284,212 284,204 V 116 Q 284,108 292,108 H 340" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ag-arrow-accent)"/>
  <path d="M 260,224 H 288 Q 296,224 296,216 V 196 Q 296,188 304,188 H 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
  <path d="M 260,240 H 312 Q 320,240 320,248 V 260 Q 320,268 328,268 H 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
  <path d="M 260,252 H 300 Q 308,252 308,260 V 340 Q 308,348 316,348 H 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
  <!-- Agents to tools -->
  <line x1="540" y1="108" x2="620" y2="108" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ag-arrow-link)"/>
  <line x1="540" y1="188" x2="620" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
  <line x1="540" y1="268" x2="620" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
  <line x1="540" y1="348" x2="620" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>

  <!-- Arrow labels (above the strokes) -->
  <rect x="548" y="88" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="97" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLL 60 S</text>
  <rect x="548" y="168" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN MODEL</text>
  <rect x="548" y="248" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>
  <rect x="548" y="328" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRAFT</text>

  <!-- Node: Orchestrator (focal) -->
  <rect x="40" y="196" width="220" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="196" width="220" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="48" y="204" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="70" y="213" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="150" y="236" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Orchestrator agent</text>
  <text x="150" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">question / trigger → plan</text>

  <!-- Agents -->
  <rect x="340" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="340" y="80" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="440" y="105" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Monitor agent</text>
  <text x="440" y="121" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">detects flare onset, Bz turns</text>

  <rect x="340" y="160" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="340" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="440" y="185" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Modelling agent</text>
  <text x="440" y="201" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fits sim, runs forecasts</text>

  <rect x="340" y="240" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="340" y="240" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="440" y="265" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Research agent</text>
  <text x="440" y="281" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">past events + papers (RAG)</text>

  <rect x="340" y="320" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="340" y="320" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="440" y="345" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Reporter agent</text>
  <text x="440" y="361" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes cited bulletin</text>

  <!-- Tools -->
  <rect x="620" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="620" y="80" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="628" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="642" y="95" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="720" y="113" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Live data tools</text>
  <text x="720" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GOES · RTSW · DONKI</text>

  <rect x="620" y="160" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="620" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="720" y="185" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Physics + ML models</text>
  <text x="720" y="201" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sim engine · forecasters</text>

  <rect x="620" y="240" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="620" y="240" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="628" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="648" y="255" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="720" y="273" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Memory</text>
  <text x="720" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">event DB · vector index</text>

  <rect x="620" y="320" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="620" y="320" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="628" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="642" y="335" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <text x="720" y="353" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bulletin / alert</text>
  <text x="720" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">human review before send</text>

  <!-- Legend -->
  <line x1="40" y1="412" x2="820" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="442" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="60" y="450" fill="#4f5d75" font-size="8.5">Focal: entry and output</text>
  <rect x="200" y="442" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="220" y="450" fill="#4f5d75" font-size="8.5">Agent / model</text>
  <rect x="320" y="442" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="340" y="450" fill="#4f5d75" font-size="8.5">Store</text>
  <rect x="400" y="442" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="420" y="450" fill="#4f5d75" font-size="8.5">External API</text>
  <line x1="520" y1="448" x2="548" y2="448" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ag-arrow-accent)"/>
  <text x="556" y="450" fill="#4f5d75" font-size="8.5">Always-on path</text>
  <line x1="660" y1="448" x2="688" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ag-arrow)"/>
  <text x="696" y="450" fill="#4f5d75" font-size="8.5">Delegation / tool call</text>
</svg>
