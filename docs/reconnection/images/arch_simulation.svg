<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-simulation-title arch-simulation-desc" font-family="Geist, system-ui, sans-serif">
  <title id="arch-simulation-title">Reconnection simulator architecture</title>
  <desc id="arch-simulation-desc">Live NOAA and NASA feeds are fetched and cached, fed with user sliders into a physics engine that builds a timeline rendered as four linked panels.</desc>
  <defs>
    <pattern id="sim-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
    <marker id="sim-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="sim-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="sim-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#sim-dots)" opacity="0.55"/>

  <text x="40" y="36" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE · RECONNECTION SIMULATOR</text>

  <!-- Zone: live feeds -->
  <rect x="28" y="84" width="176" height="268" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="80" y="88" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="116" y="97" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LIVE FEEDS</text>

  <!-- Arrows first -->
  <path d="M 190,136 H 222 Q 230,136 230,144 V 189 Q 230,197 238,197 H 260" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sim-arrow-link)"/>
  <line x1="190" y1="218" x2="260" y2="218" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sim-arrow-link)"/>
  <path d="M 190,300 H 222 Q 230,300 230,292 V 247 Q 230,239 238,239 H 260" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sim-arrow-link)"/>
  <line x1="420" y1="218" x2="500" y2="218" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#sim-arrow-accent)"/>
  <line x1="610" y1="112" x2="610" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sim-arrow)"/>
  <line x1="720" y1="218" x2="780" y2="218" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#sim-arrow-accent)"/>
  <line x1="860" y1="260" x2="860" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sim-arrow)"/>
  <line x1="340" y1="260" x2="340" y2="320" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#sim-arrow)"/>

  <!-- Arrow labels -->
  <rect x="424" y="196" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="460" y="205" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNIFIED JSON</text>
  <rect x="618" y="138" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="658" y="147" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B · n · L · M · γ</text>
  <rect x="724" y="196" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="750" y="205" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIMELINE</text>
  <rect x="868" y="284" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="890" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER</text>
  <rect x="348" y="284" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="376" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>

  <!-- Node: GOES -->
  <rect x="40" y="108" width="150" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="108" width="150" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="62" y="123" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="115" y="141" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">NOAA GOES X-ray</text>
  <text x="115" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">xrays-3-day.json</text>

  <!-- Node: RTSW -->
  <rect x="40" y="190" width="150" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="190" width="150" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="62" y="205" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="115" y="223" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">NOAA RTSW (L1)</text>
  <text x="115" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rtsw_mag / wind_1m</text>

  <!-- Node: DONKI -->
  <rect x="40" y="272" width="150" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="272" width="150" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="278" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="62" y="287" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="115" y="305" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">NASA DONKI</text>
  <text x="115" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CMEAnalysis · FLR</text>

  <!-- Node: Fetcher -->
  <rect x="260" y="176" width="160" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="260" y="176" width="160" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="268" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="282" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="412" y="252" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
  <text x="340" y="220" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Fetch + normalise</text>
  <text x="340" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">js/api.js · 60 s poll</text>

  <!-- Node: Sliders -->
  <rect x="520" y="56" width="180" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="520" y="56" width="180" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="528" y="62" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="544" y="71" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="610" y="89" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Model sliders</text>
  <text x="610" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">values not measured live</text>

  <!-- Node: Physics engine (focal) -->
  <rect x="500" y="176" width="220" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="176" width="220" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="508" y="184" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="526" y="193" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="712" y="252" fill="rgba(235,108,54,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
  <text x="610" y="220" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Physics engine</text>
  <text x="610" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reconnection · flare · DBM · Newell</text>

  <!-- Node: Timeline store -->
  <rect x="780" y="176" width="160" height="84" rx="6" fill="#f5f5f5"/>
  <rect x="780" y="176" width="160" height="84" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="788" y="184" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="808" y="193" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
  <text x="860" y="220" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Event timeline</text>
  <text x="860" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state.js · ring buffer</text>

  <!-- Node: Views -->
  <rect x="780" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="780" y="320" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="788" y="328" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="798" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="860" y="358" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Four linked panels</text>
  <text x="860" y="373" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Plotly · Three.js</text>

  <!-- Node: Snapshot -->
  <rect x="260" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="260" y="320" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="268" y="328" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="288" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="340" y="358" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Snapshot cache</text>
  <text x="340" y="373" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/*.json</text>

  <!-- Legend -->
  <line x1="40" y1="412" x2="940" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="40" y="442" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="60" y="450" fill="#4f5d75" font-size="8.5">Focal: physics engine</text>
  <rect x="200" y="442" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="220" y="450" fill="#4f5d75" font-size="8.5">Code module</text>
  <rect x="320" y="442" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="340" y="450" fill="#4f5d75" font-size="8.5">State / store</text>
  <rect x="430" y="442" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="450" y="450" fill="#4f5d75" font-size="8.5">External feed / user input</text>
  <line x1="600" y1="448" x2="628" y2="448" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sim-arrow-link)"/>
  <text x="636" y="450" fill="#4f5d75" font-size="8.5">HTTP fetch</text>
  <line x1="712" y1="448" x2="740" y2="448" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#sim-arrow-accent)"/>
  <text x="748" y="450" fill="#4f5d75" font-size="8.5">Primary flow</text>
  <line x1="832" y1="448" x2="860" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#sim-arrow)"/>
  <text x="868" y="450" fill="#4f5d75" font-size="8.5">Fallback</text>
</svg>
